server:
  port: 8080

spring:
  application:
    name: coupon-gateway
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  cloud:
    gateway:
      server:
        webflux:
          routes:
            # 외부에 공개할 사용자 API만 명시하고 한도를 적용한다. 관리자와 메트릭 API는 라우팅하지 않는다.
            #
            # 경로에 v1 이 붙는 것이 강의 원본과 다른 점이다. 이 저장소의 컨트롤러는
            # /api/v1/coupons, /api/v1/issuances, /api/v1/users/me/issuances 이고
            # 대기실만 /api/waiting-room 으로 v1 이 없다. 원본 경로를 그대로 두면
            # 발급/사용/조회가 게이트웨이를 아예 안 거쳐서(404) rate limit 이 발급 경로를
            # 안 지키는데, k6 은 대기실만 때리므로 PASS 가 찍힌다 — 조용히 틀리는 자리다.
            #
            # 쿠폰 생성(POST /api/v1/coupons)은 일부러 뺐다. 측정 스크립트가 8080 으로 직접 만든다.
            - id: public-user-api
              uri: ${COUPON_SERVICE_URI:http://localhost:8080}
              predicates:
                - Path=/api/waiting-room/**,/api/v1/coupons/*/issue,/api/v1/issuances/*/use,/api/v1/users/me/issuances
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@userIdKeyResolver}"
                    # Token Bucket: 초당 replenishRate 채움, 순간 최대 burstCapacity.
                    redis-rate-limiter.replenishRate: ${RATE_LIMIT_REPLENISH:5}
                    redis-rate-limiter.burstCapacity: ${RATE_LIMIT_BURST:10}
                    redis-rate-limiter.requestedTokens: 1
