spring:
  application:
    name: coupon
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/coupon}
    username: ${SPRING_DATASOURCE_USERNAME:coupon}
    password: ${SPRING_DATASOURCE_PASSWORD:coupon}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 기본값 10 은 이 워크로드에 맞지 않는다. Redis 게이트가 발급분 5,000건을 1초 안에
      # 통과시키는데 커넥션이 10개뿐이라 전부 여기서 줄을 섰다 (성공 응답 4.45초의 정체).
      # 50 으로 올려 1.32초가 됐다. docs/load-test-k6.md 12.7 절.
      maximum-pool-size: 50
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  jpa:
    hibernate:
      # 운영에서는 당연히 none으로
      ddl-auto: update
    open-in-view: false
    show-sql: true
  mvc:
    problemdetails:
      enabled: true
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9094}

coupon:
  cache:
    # 쿠폰 캐시 TTL. stampede 측정 시 1000 (1초) 으로 오버라이드.
    ttl-ms: ${COUPON_CACHE_TTL_MS:10000}
    # SWR fresh window, 캐시를 최신으로 보는 시간, ttl-ms보다 짧게. 이 안: 즉시 반환, 넘으면 stale + 백그라운드 갱신.
    fresh-ms: ${COUPON_CACHE_FRESH_MS:500}
    # loader latency (DB 조회 지연시간) 시뮬레이션. loader 안에서 Thread.sleep. 0=비활성.
    simulated-load-latency-ms: ${COUPON_CACHE_SIMULATED_LOAD_LATENCY_MS:0}
  sold-out:
    # 매진 플래그 Redis TTL (이벤트 종료까지 유지)
    ttl-seconds: ${COUPON_SOLD_OUT_TTL_SECONDS:86400}
    # Application fast-path (Caffeine) TTL. 매진 직후 이 시간만큼 실제 매진을 아직 모를 수 있다.
    fast-path-ttl-ms: ${COUPON_SOLD_OUT_FAST_PATH_TTL_MS:1000}

logging:
  level:
    com.example.coupon: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
