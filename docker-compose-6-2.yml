services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: coupon
      MYSQL_USER: coupon
      MYSQL_PASSWORD: coupon
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.0
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    # Kafka 3.8 부터 KRaft 모드가 기본이라 ZooKeeper 없음.
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9094:9094"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 20

  coupon-service: &coupon-service
    # 이미지 빌드: coupon-service/coupon 디렉토리에서 ./gradlew jibDockerBuild
    image: coupon-service:latest
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment: &coupon-env
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/coupon
      SPRING_DATASOURCE_USERNAME: coupon
      SPRING_DATASOURCE_PASSWORD: coupon
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # stampede 데모 기본값 1초. 셸에서 COUPON_CACHE_TTL_MS=10000 으로 오버라이드 가능.
      COUPON_CACHE_TTL_MS: ${COUPON_CACHE_TTL_MS:-1000}
      # issue 쿠폰 정보 조회의 stampede 차이를 보이기 위한 DB latency 시뮬레이션.
      COUPON_CACHE_SIMULATED_LOAD_LATENCY_MS: ${COUPON_CACHE_SIMULATED_LOAD_LATENCY_MS:-100}
      COUPON_CACHE_FRESH_MS: ${COUPON_CACHE_FRESH_MS:-500}
      # reconcile 배치 주기. 기본 1분. 검증 스크립트는 수동 트리거와 겹치지 않게 크게 오버라이드한다.
      COUPON_RECONCILE_INTERVAL_MS: ${COUPON_RECONCILE_INTERVAL_MS:-60000}
      # 통과 속도(기본 100/s). Redis 대기실이라 서버를 늘려도 유지된다.
      COUPON_WAITING_ROOM_ADMIT_PER_SECOND: ${COUPON_WAITING_ROOM_ADMIT_PER_SECOND:-100}
      COUPON_WAITING_ROOM_PASS_TTL_MS: ${COUPON_WAITING_ROOM_PASS_TTL_MS:-30000}
    ports:
      # 강의 스크립트의 직접 측정용. 운영에서는 publish 하지 않고 Gateway 내부망으로만 연결한다.
      - "8080:8080"

  # 통과 속도 유지 확인용 2번째 인스턴스. `docker compose --profile scale up -d` 로만 띄운다.
  coupon-service-2:
    <<: *coupon-service
    profiles: ["scale"]
    ports:
      - "8081:8080"
  # API Gateway. 어뷰저를 대기실 진입과 발급 앞에서 사용자별로 컷. 이미지 빌드: ./gradlew jibDockerBuild
  gateway:
    image: coupon-gateway:latest
    depends_on:
      redis:
        condition: service_healthy
      coupon-service:
        condition: service_started
    environment:
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      COUPON_SERVICE_URI: http://coupon-service:8080
      # 한 사용자는 초당 5번, 순간 최대 10번까지. 셸에서 오버라이드 가능.
      RATE_LIMIT_REPLENISH: ${RATE_LIMIT_REPLENISH:-5}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-10}
    ports:
      - "8090:8080"
volumes:
  mysql-data:
  redis-data:
