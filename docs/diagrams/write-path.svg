<svg xmlns="http://www.w3.org/2000/svg" width="680" height="520" viewBox="0 0 680 520" role="img">
<title>발급 기록의 비동기 쓰기 경로</title>
<desc>issuance.requested 토픽을 컨슈머 3개가 소비해 IssuanceWriter, IssuanceTransactionWriter 를 거쳐 issuance 행 INSERT 와 coupon 행 UPDATE 를 한 트랜잭션으로 치는 흐름, 그리고 실패 시 DLT 로 빠졌다가 로그 테이블에 쌓이고 관리자가 다시 발행하는 갈래.</desc>
<style>
text{font-family:"Segoe UI","Malgun Gothic",sans-serif}
.t{font-size:14px;fill:#2C2C2A}
.ts{font-size:12px;fill:#5F5E5A}
.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.box rect{fill:#F1EFE8;stroke:#888780;stroke-width:.5}
.teal rect{fill:#E1F5EE;stroke:#0F6E56;stroke-width:.5}
.teal .th,.teal .t{fill:#085041}
.teal .ts{fill:#0F6E56}
.purple rect{fill:#EEEDFE;stroke:#534AB7;stroke-width:.5}
.purple .th,.purple .t{fill:#3C3489}
.purple .ts{fill:#534AB7}
.red rect{fill:#FCEBEB;stroke:#A32D2D;stroke-width:.5}
.red .th,.red .t{fill:#791F1F}
.red .ts{fill:#A32D2D}
.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="520" fill="#FFFFFF"/>

<g class="purple"><rect x="150" y="40" width="260" height="56" rx="8"/><text class="th" x="280" y="59" text-anchor="middle" dominant-baseline="central">Kafka · issuance.requested</text><text class="ts" x="280" y="78" text-anchor="middle" dominant-baseline="central">파티션 3 · key = userId</text></g>
<line x1="280" y1="98" x2="280" y2="126" class="arr" marker-end="url(#arrow)"/>

<g class="purple"><rect x="150" y="130" width="260" height="56" rx="8"/><text class="th" x="280" y="149" text-anchor="middle" dominant-baseline="central">IssuanceWorker</text><text class="ts" x="280" y="168" text-anchor="middle" dominant-baseline="central">@KafkaListener · 컨슈머 3</text></g>
<line x1="280" y1="188" x2="280" y2="216" class="arr" marker-end="url(#arrow)"/>

<g class="box"><rect x="150" y="220" width="260" height="56" rx="8"/><text class="th" x="280" y="239" text-anchor="middle" dominant-baseline="central">IssuanceWriter</text><text class="ts" x="280" y="258" text-anchor="middle" dominant-baseline="central">UNIQUE 위반은 멱등 처리</text></g>
<line x1="410" y1="248" x2="440" y2="248" class="arr" marker-end="url(#arrow)"/>
<g class="red"><rect x="450" y="220" width="190" height="56" rx="8"/><text class="th" x="545" y="239" text-anchor="middle" dominant-baseline="central">DLT 토픽</text><text class="ts" x="545" y="258" text-anchor="middle" dominant-baseline="central">1초 × 3회 뒤 · 보상 없음</text></g>
<line x1="280" y1="278" x2="280" y2="306" class="arr" marker-end="url(#arrow)"/>

<g class="teal"><rect x="150" y="310" width="260" height="56" rx="8"/><text class="th" x="280" y="329" text-anchor="middle" dominant-baseline="central">IssuanceTransactionWriter</text><text class="ts" x="280" y="348" text-anchor="middle" dominant-baseline="central">@Transactional · INSERT + UPDATE</text></g>
<line x1="280" y1="368" x2="280" y2="396" class="arr" marker-end="url(#arrow)"/>

<g class="box"><rect x="150" y="400" width="260" height="56" rx="8"/><text class="th" x="280" y="419" text-anchor="middle" dominant-baseline="central">issuance 행 + coupon 행</text><text class="ts" x="280" y="438" text-anchor="middle" dominant-baseline="central">단일 행 UPDATE 가 되돌아왔다</text></g>
<line x1="545" y1="278" x2="545" y2="306" class="arr" marker-end="url(#arrow)"/>
<g class="box"><rect x="450" y="310" width="190" height="56" rx="8"/><text class="th" x="545" y="329" text-anchor="middle" dominant-baseline="central">DLT 로그 테이블</text><text class="ts" x="545" y="348" text-anchor="middle" dominant-baseline="central">PENDING 으로 적재</text></g>
<line x1="545" y1="368" x2="545" y2="396" class="arr" marker-end="url(#arrow)"/>
<g class="box"><rect x="450" y="400" width="190" height="56" rx="8"/><text class="th" x="545" y="419" text-anchor="middle" dominant-baseline="central">관리자 재발행</text><text class="ts" x="545" y="438" text-anchor="middle" dominant-baseline="central">수동 · 한 번에 100건까지</text></g>
<path d="M640 428 L664 428 L664 68 L414 68" class="arr" marker-end="url(#arrow)"/>

<text class="ts" x="40" y="500">teal = 트랜잭션 경계 · purple = 프로세스 밖 · red = 실패 격리 (재고는 되돌리지 않는다)</text>
</svg>
