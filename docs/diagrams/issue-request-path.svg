<svg xmlns="http://www.w3.org/2000/svg" width="680" height="590" viewBox="0 0 680 590" role="img">
<title>쿠폰 발급 요청의 동기 경로</title>
<desc>POST /api/v1/coupons/{id}/issue 가 매진 fast path, 발급 정책 조회, issue.lua 원자 판정, Kafka 발행을 차례로 지나 200 접수 응답으로 끝나는 흐름과 각 단계에서 갈라지는 409·503 응답.</desc>
<style>
text{font-family:"Segoe UI","Malgun Gothic",sans-serif}
.t{font-size:14px;fill:#2C2C2A}
.ts{font-size:12px;fill:#5F5E5A}
.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.box rect{fill:#F1EFE8;stroke:#888780;stroke-width:.5}
.teal rect{fill:#E1F5EE;stroke:#0F6E56;stroke-width:.5}
.teal .th,.teal .t{fill:#085041}
.teal .ts{fill:#0F6E56}
.purple rect{fill:#EEEDFE;stroke:#534AB7;stroke-width:.5}
.purple .th,.purple .t{fill:#3C3489}
.purple .ts{fill:#534AB7}
.red rect{fill:#FCEBEB;stroke:#A32D2D;stroke-width:.5}
.red .th,.red .t{fill:#791F1F}
.red .ts{fill:#A32D2D}
.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="590" fill="#FFFFFF"/>

<g class="box"><rect x="150" y="40" width="260" height="56" rx="8"/><text class="th" x="280" y="59" text-anchor="middle" dominant-baseline="central">POST /coupons/{id}/issue</text><text class="ts" x="280" y="78" text-anchor="middle" dominant-baseline="central">요청 스레드 · 트랜잭션 없음</text></g>
<line x1="280" y1="98" x2="280" y2="126" class="arr" marker-end="url(#arrow)"/>

<g class="teal"><rect x="150" y="130" width="260" height="56" rx="8"/><text class="th" x="280" y="149" text-anchor="middle" dominant-baseline="central">① 매진 fast path</text><text class="ts" x="280" y="168" text-anchor="middle" dominant-baseline="central">Caffeine L1 · 미스만 Redis</text></g>
<line x1="410" y1="158" x2="440" y2="158" class="arr" marker-end="url(#arrow)"/>
<g class="box"><rect x="450" y="136" width="190" height="44" rx="8"/><text class="t" x="545" y="158" text-anchor="middle" dominant-baseline="central">409 SOLD_OUT</text></g>
<line x1="280" y1="188" x2="280" y2="216" class="arr" marker-end="url(#arrow)"/>

<g class="purple"><rect x="150" y="220" width="260" height="56" rx="8"/><text class="th" x="280" y="239" text-anchor="middle" dominant-baseline="central">② 발급 정책 조회</text><text class="ts" x="280" y="258" text-anchor="middle" dominant-baseline="central">Redis 캐시 · single-flight · SWR</text></g>
<line x1="410" y1="248" x2="440" y2="248" class="arr" marker-end="url(#arrow)"/>
<g class="box"><rect x="450" y="226" width="190" height="44" rx="8"/><text class="t" x="545" y="248" text-anchor="middle" dominant-baseline="central">409 NOT_STARTED</text></g>
<line x1="280" y1="278" x2="280" y2="306" class="arr" marker-end="url(#arrow)"/>

<g class="teal"><rect x="150" y="310" width="260" height="56" rx="8"/><text class="th" x="280" y="329" text-anchor="middle" dominant-baseline="central">③ issue.lua 원자 판정</text><text class="ts" x="280" y="348" text-anchor="middle" dominant-baseline="central">재고 차감 + 1인 1매 검사</text></g>
<line x1="410" y1="338" x2="440" y2="338" class="arr" marker-end="url(#arrow)"/>
<g class="box"><rect x="450" y="310" width="190" height="56" rx="8"/><text class="th" x="545" y="329" text-anchor="middle" dominant-baseline="central">409 CONFLICT</text><text class="ts" x="545" y="348" text-anchor="middle" dominant-baseline="central">이미 발급 / 매진</text></g>
<line x1="280" y1="368" x2="280" y2="396" class="arr" marker-end="url(#arrow)"/>

<g class="purple"><rect x="150" y="400" width="260" height="56" rx="8"/><text class="th" x="280" y="419" text-anchor="middle" dominant-baseline="central">④ Kafka 발행</text><text class="ts" x="280" y="438" text-anchor="middle" dominant-baseline="central">issuance.requested · key=userId</text></g>
<line x1="410" y1="428" x2="440" y2="428" class="arr" marker-end="url(#arrow)"/>
<g class="red"><rect x="450" y="400" width="190" height="56" rx="8"/><text class="th" x="545" y="419" text-anchor="middle" dominant-baseline="central">503</text><text class="ts" x="545" y="438" text-anchor="middle" dominant-baseline="central">재고는 깎인 채로 남음</text></g>
<line x1="280" y1="458" x2="280" y2="486" class="arr" marker-end="url(#arrow)"/>

<g class="box"><rect x="150" y="490" width="260" height="56" rx="8"/><text class="th" x="280" y="509" text-anchor="middle" dominant-baseline="central">200 OK</text><text class="ts" x="280" y="528" text-anchor="middle" dominant-baseline="central">발급 완료 아님 = 접수 완료</text></g>

<text class="ts" x="40" y="572">teal = 원자성이 보장되는 자리 · purple = 프로세스 밖으로 나가는 자리</text>
</svg>
