<svg xmlns="http://www.w3.org/2000/svg" width="680" height="480" viewBox="0 0 680 480" role="img">
<title>발급 정책 조회 캐시</title>
<desc>발급 정책 조회가 Lua 스크립트 한 번으로 캐시와 락 상태를 보고 HIT, STALE_REFRESH, LOAD, WAIT 네 갈래로 나뉘는 흐름. DB 까지 가는 것은 락을 잡은 요청 하나뿐이고 WAIT 은 잠시 뒤 다시 묻는다.</desc>
<style>
text{font-family:"Segoe UI","Malgun Gothic",sans-serif}
.t{font-size:14px;fill:#2C2C2A}
.ts{font-size:12px;fill:#5F5E5A}
.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.box rect{fill:#F1EFE8;stroke:#888780;stroke-width:.5}
.teal rect{fill:#E1F5EE;stroke:#0F6E56;stroke-width:.5}
.teal .th,.teal .t{fill:#085041}
.teal .ts{fill:#0F6E56}
.purple rect{fill:#EEEDFE;stroke:#534AB7;stroke-width:.5}
.purple .th,.purple .t{fill:#3C3489}
.purple .ts{fill:#534AB7}
.red rect{fill:#FCEBEB;stroke:#A32D2D;stroke-width:.5}
.red .th,.red .t{fill:#791F1F}
.red .ts{fill:#A32D2D}
.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="480" fill="#FFFFFF"/>

<g class="box"><rect x="210" y="40" width="260" height="56" rx="8"/><text class="th" x="340" y="59" text-anchor="middle" dominant-baseline="central">발급 정책 조회</text><text class="ts" x="340" y="78" text-anchor="middle" dominant-baseline="central">시작 시각 · 유효 기간</text></g>
<line x1="340" y1="98" x2="340" y2="126" class="arr" marker-end="url(#arrow)"/>

<g class="teal"><rect x="210" y="130" width="260" height="56" rx="8"/><text class="th" x="340" y="149" text-anchor="middle" dominant-baseline="central">Lua 한 번</text><text class="ts" x="340" y="168" text-anchor="middle" dominant-baseline="central">캐시 · 락을 원자적으로 확인</text></g>

<path d="M340 188 L340 204 L92 204 L92 236" class="arr" marker-end="url(#arrow)"/>
<path d="M340 204 L257 204 L257 236" class="arr" marker-end="url(#arrow)"/>
<path d="M340 204 L422 204 L422 236" class="arr" marker-end="url(#arrow)"/>
<path d="M340 204 L587 204 L587 236" class="arr" marker-end="url(#arrow)"/>

<g class="box"><rect x="20" y="240" width="145" height="56" rx="8"/><text class="th" x="92" y="259" text-anchor="middle" dominant-baseline="central">HIT</text><text class="ts" x="92" y="278" text-anchor="middle" dominant-baseline="central">0.5초 안 · 즉시 반환</text></g>
<g class="box"><rect x="185" y="240" width="145" height="56" rx="8"/><text class="th" x="257" y="259" text-anchor="middle" dominant-baseline="central">STALE_REFRESH</text><text class="ts" x="257" y="278" text-anchor="middle" dominant-baseline="central">옛 값 반환 + 뒤에서 갱신</text></g>
<g class="box"><rect x="350" y="240" width="145" height="56" rx="8"/><text class="th" x="422" y="259" text-anchor="middle" dominant-baseline="central">LOAD</text><text class="ts" x="422" y="278" text-anchor="middle" dominant-baseline="central">락을 잡은 1명</text></g>
<g class="box"><rect x="515" y="240" width="145" height="56" rx="8"/><text class="th" x="587" y="259" text-anchor="middle" dominant-baseline="central">WAIT</text><text class="ts" x="587" y="278" text-anchor="middle" dominant-baseline="central">누가 채우는 중</text></g>

<path d="M660 268 L672 268 L672 158 L472 158" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="600" y="150" text-anchor="middle">20ms 뒤 다시</text>

<path d="M257 298 L257 326 L300 326 L300 346" class="arr" marker-end="url(#arrow)"/>
<path d="M422 298 L422 326 L380 326 L380 346" class="arr" marker-end="url(#arrow)"/>

<g class="purple"><rect x="210" y="350" width="260" height="56" rx="8"/><text class="th" x="340" y="369" text-anchor="middle" dominant-baseline="central">MySQL SELECT coupon</text><text class="ts" x="340" y="388" text-anchor="middle" dominant-baseline="central">채우고 나서 락을 푼다</text></g>

<text class="ts" x="40" y="450">teal = 원자성이 보장되는 자리 · purple = DB 까지 가는 자리 (전체 15,001건 중 49건)</text>
</svg>
